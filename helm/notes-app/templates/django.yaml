apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
spec:
  replicas: {{ .Values.django.replicas }}

  selector:
    matchLabels:
      app: django

  template:
    metadata:
      labels:
        app: django

    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL..."
              until nc -z mysql 3306; do
                sleep 2
              done
              echo "MySQL is ready."

      containers:
        - name: django
          image: {{ .Values.django.image }}
          imagePullPolicy: {{ .Values.django.imagePullPolicy }}

          ports:
            - containerPort: {{ .Values.django.service.targetPort }}

          env:
            - name: DB_HOST
              value: "{{ .Values.django.database.host }}"

            - name: DB_PORT
              value: "{{ .Values.django.database.port }}"

            - name: DB_NAME
              value: "{{ .Values.django.database.name }}"

            - name: DB_USER
              value: "{{ .Values.django.database.user }}"

            - name: DB_PASSWORD
              value: "{{ .Values.django.database.password }}"

          command:
            - sh
            - -c
            - |
              python manage.py migrate --noinput
              gunicorn notesapp.wsgi --bind 0.0.0.0:8000

---
apiVersion: v1
kind: Service
metadata:
  name: django
spec:
  selector:
    app: django

  ports:
    - port: {{ .Values.django.service.port }}
      targetPort: {{ .Values.django.service.targetPort }}
