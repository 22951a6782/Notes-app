apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app-deployment
  labels:
    app: notes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-app
  template:
    metadata:
      labels:
        app: notes-app
    spec:
      containers:
      - name: notes-app
        image: YOUR_DOCKERHUB_USERNAME/notes-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: notes-app-service
spec:
  type: NodePort
  selector:
    app: notes-app
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30001
