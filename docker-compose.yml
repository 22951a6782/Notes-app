services:

  nginx:
    build:
      context: ./nginx
    image: notes-nginx:latest
    container_name: nginx_cont
    ports:
      - "80:80"
    restart: always
    depends_on:
      - django
    networks:
      - notes-app-nw

  django:
    build:
      context: .
    image: notes-app:latest
    container_name: django_cont
    command: sh -c "python manage.py migrate --noinput && gunicorn notesapp.wsgi --bind 0.0.0.0:8000"
    env_file:
      - ".env"
    depends_on:
      - db
    restart: always
    networks:
      - notes-app-nw

  db:
    image: mysql:8.0
    container_name: db_cont
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    volumes:
      - ./data/mysql/db:/var/lib/mysql
    networks:
      - notes-app-nw

networks:
  notes-app-nw:
